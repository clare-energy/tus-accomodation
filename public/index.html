<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUS Moylish Accommodation Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :focus-visible {
      outline: 3px solid #1d4ed8;
      outline-offset: 2px;
      border-radius: 2px;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: #f1f5f9;
      font-size: 1.0625rem; /* 17px base, up from browser default 16px */
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #1e3a5f;
      color: #fff;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    #header .tus-logo {
      font-size: 1.7rem;
      line-height: 1;
    }
    #status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      font-size: 1rem;
      color: #cfe0fb;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    #last-updated { color: #cfe0fb; }
    #stale-badge, #refreshing-badge {
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 0.92rem;
      display: none;
    }
    #stale-badge {
      background: #f59e0b;
      color: #1c1917;
    }
    #refreshing-badge {
      background: #3b82f6;
      color: #fff;
      animation: pulse 1.5s infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      #refreshing-badge { animation: none; }
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

    button#refresh-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      min-height: 44px;
    }
    button#refresh-btn:hover { background: #1d4ed8; }
    button#refresh-btn:disabled { background: #64748b; cursor: not-allowed; }

    /* ── Filter bar ── */
    #filter-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: #fff;
      border: none;
      border-bottom: 1px solid #cbd5e1;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #filter-bar legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    #filter-bar label {
      font-size: 0.95rem;
      font-weight: 500;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      min-height: 44px;
      padding: 4px 2px;
    }
    #filter-bar input[type="checkbox"] {
      width: 22px; height: 22px;
      cursor: pointer;
      accent-color: #1d4ed8;
      flex-shrink: 0;
    }
    .dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      border: 1.5px solid rgba(0,0,0,0.25);
    }
    .sep { width: 1px; height: 28px; background: #cbd5e1; }

    #filter-bar .range-group {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.95rem; font-weight: 500; color: #334155;
      min-height: 44px;
    }
    #filter-bar .range-group label { min-height: auto; padding: 0; cursor: default; }
    #filter-bar input[type="range"] {
      width: 130px;
      accent-color: #1d4ed8;
      cursor: pointer;
      height: 22px;
    }
    #contacted-note {
      margin-left: auto;
      font-size: 0.88rem;
      color: #475569;
      white-space: nowrap;
    }
    #count-label {
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }

    /* ── Map ── */
    #map { flex: 1; z-index: 0; }
    #map:focus-visible { outline-offset: -3px; }

    .marker-badge {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      border: 2.5px solid #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,0.5);
    }
    .marker-wrap { position: relative; width: 28px; height: 28px; }
    .marker-wrap.contacted .marker-badge { opacity: 0.5; }
    .marker-wrap.contacted::before,
    .marker-wrap.contacted::after {
      content: "";
      position: absolute;
      left: 1px; right: 1px; top: 50%;
      height: 3.5px;
      background: #111827;
      box-shadow: 0 0 0 1.5px #fff;
      border-radius: 2px;
    }
    .marker-wrap.contacted::before { transform: translateY(-50%) rotate(45deg); }
    .marker-wrap.contacted::after  { transform: translateY(-50%) rotate(-45deg); }

    /* ── Loading overlay ── */
    #loading {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      gap: 16px;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    #loading.hidden { display: none; }
    .spinner {
      width: 56px; height: 56px;
      border: 5px solid rgba(255,255,255,0.25);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading strong { font-size: 1.15rem; }
    #loading p { font-size: 1rem; color: #cbd5e1; margin-top: 4px; max-width: 40ch; }

    /* ── Popup ── */
    .popup-card { min-width: 240px; max-width: 320px; }
    .popup-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .popup-row {
      display: flex; justify-content: space-between; gap: 10px;
      font-size: 0.95rem; color: #334155;
      padding: 5px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .popup-row:last-of-type { border-bottom: none; }
    .popup-row strong { color: #1e293b; }
    .popup-deposit { color: #475569; font-size: 0.85rem; }
    .popup-type {
      display: inline-block;
      margin: 6px 0;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }
    .popup-link {
      display: block;
      margin-top: 12px;
      text-align: center;
      background: #1e3a5f;
      color: #fff;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 44px;
      line-height: 1.3;
    }
    .popup-link:hover, .popup-link:focus-visible { background: #2563eb; }
    .no-coords {
      font-size: 0.85rem; color: #475569;
      font-style: italic; margin-top: 4px;
    }
    .contact-status {
      font-size: 0.85rem;
      font-weight: 700;
      color: #111827;
      margin: 2px 0 6px;
    }
    .contact-toggle {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 2px solid #334155;
      background: #fff;
      color: #334155;
      cursor: pointer;
      min-height: 44px;
    }
    .contact-toggle:hover, .contact-toggle:focus-visible { background: #f1f5f9; }
    .contact-toggle.is-contacted {
      background: #334155;
      color: #fff;
    }
    .contact-toggle.is-contacted:hover, .contact-toggle.is-contacted:focus-visible { background: #1e293b; }
  </style>
</head>
<body>

<div id="loading" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <strong>Loading accommodation data…</strong>
  <p>First load fetches &amp; geocodes all listings — this can take a few minutes.</p>
</div>

<header id="header">
  <span class="tus-logo" aria-hidden="true">🏫</span>
  <h1>TUS Moylish Accommodation Map</h1>
  <div id="status-bar" aria-live="polite">
    <span id="stale-badge">Data outdated</span>
    <span id="refreshing-badge">⟳ Refreshing…</span>
    <span id="last-updated"></span>
    <button id="refresh-btn" type="button" onclick="forceRefresh()">Refresh now</button>
  </div>
</header>

<fieldset id="filter-bar">
  <legend>Filter listings by type, price and beds</legend>
  <label>
    <input type="checkbox" id="chk-digs" checked onchange="applyFilters()">
    <span class="dot" style="background:#2563eb" aria-hidden="true"></span>
    Digs 5 Days
  </label>
  <label>
    <input type="checkbox" id="chk-room" checked onchange="applyFilters()">
    <span class="dot" style="background:#15803d" aria-hidden="true"></span>
    Room in Owner Occupied House
  </label>
  <label>
    <input type="checkbox" id="chk-bnb" checked onchange="applyFilters()">
    <span class="dot" style="background:#b45309" aria-hidden="true"></span>
    Digs/B&amp;B 7 Days
  </label>
  <label>
    <input type="checkbox" id="chk-room7" checked onchange="applyFilters()">
    <span class="dot" style="background:#9333ea" aria-hidden="true"></span>
    Room in Owner Occupied House 7 Days
  </label>
  <div class="sep" aria-hidden="true"></div>
  <div class="range-group">
    <label for="max-weekly">Max weekly:</label>
    <input type="range" id="max-weekly" min="50" max="400" value="400" step="10"
      oninput="updateWeeklyLabel(); applyFilters()"
      aria-valuetext="€400 or more">
    <span id="weekly-label" aria-hidden="true">€400</span>
  </div>
  <div class="range-group">
    <label for="min-beds">Min beds:</label>
    <input type="range" id="min-beds" min="1" max="6" value="1" step="1"
      oninput="updateBedsLabel(); applyFilters()"
      aria-valuetext="1 or more beds">
    <span id="beds-label" aria-hidden="true">1+</span>
  </div>
  <span id="contacted-note">✕ = you've marked as contacted</span>
  <span id="count-label" aria-live="polite">— listings</span>
</fieldset>

<div id="map" role="region" aria-label="Map of accommodation listings near TUS Moylish campus" tabindex="0"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  const TUS_MOYLISH = [52.6741, -8.5999]; // TUS Moylish campus

  const map = L.map('map').setView(TUS_MOYLISH, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  }).addTo(map);

  // TUS campus marker
  L.marker(TUS_MOYLISH, {
    icon: L.divIcon({
      className: '',
      html: '<div style="background:#dc2626;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,0.5)"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9],
    })
  }).addTo(map).bindTooltip('TUS Moylish Campus', { permanent: false });

  const clusterGroup = L.markerClusterGroup({ chunkedLoading: true });
  map.addLayer(clusterGroup);

  // Letter abbreviation gives each listing type a non-color cue too,
  // so the map still reads correctly for colorblind/low-vision users.
  const TYPE_ABBR = {
    'Digs 5 Days': 'D5',
    'Room in Owner Occupied House': 'R',
    'Digs/B&B 7 Days': 'B7',
    'Room in Owner Occupied House 7 Days': 'R7',
  };

  let allListings = [];
  let allMarkers = []; // { marker, listing }

  // ── Contacted-listing tracking (localStorage only — no accounts, no server) ──
  const CONTACTED_KEY = 'tus-contacted-listings';

  function loadContacted() {
    try {
      const raw = localStorage.getItem(CONTACTED_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function saveContacted() {
    try {
      localStorage.setItem(CONTACTED_KEY, JSON.stringify([...contactedSet]));
    } catch {
      // localStorage unavailable (private mode, quota, etc.) — state just won't persist
    }
  }

  const contactedSet = loadContacted();

  // Eircode is the stable identity for a listing across re-scrapes; fall back
  // to URL/title for the rare listing with no eircode.
  function listingKey(l) {
    return l.eircode || l.url || l.title;
  }

  function isContacted(l) {
    return contactedSet.has(listingKey(l));
  }

  function toggleContacted(l, marker) {
    const key = listingKey(l);
    if (contactedSet.has(key)) contactedSet.delete(key);
    else contactedSet.add(key);
    saveContacted();

    marker.options.title = markerTitle(l);
    marker.options.alt = l.title + (isContacted(l) ? ' (contacted)' : '');
    marker.setIcon(markerIcon(l));
    marker.setPopupContent(makePopup(l));
    wireContactButton(marker, l);
  }

  function wireContactButton(marker, l) {
    const popupEl = marker.getPopup()?.getElement();
    const btn = popupEl?.querySelector('.contact-toggle');
    if (btn) btn.onclick = () => toggleContacted(l, marker);
  }

  function fmt(val, prefix = '€') {
    if (val == null) return '—';
    return prefix + Number(val).toLocaleString('en-IE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function markerTitle(l) {
    return `${l.title} — ${l.type}${l.weekly != null ? ' — ' + fmt(l.weekly) + '/wk' : ''}${isContacted(l) ? ' (contacted)' : ''}`;
  }

  function makePopup(l) {
    const deposit = l.weeklyDeposit ? ` <span class="popup-deposit">(dep ${fmt(l.weeklyDeposit)})</span>` : '';
    const mDeposit = l.monthlyDeposit ? ` <span class="popup-deposit">(dep ${fmt(l.monthlyDeposit)})</span>` : '';
    const contacted = isContacted(l);
    return `
      <div class="popup-card">
        <h3>${l.title}</h3>
        <span class="popup-type" style="background:${l.color}">${l.type}</span>
        ${contacted ? `<div class="contact-status">✕ Marked as contacted</div>` : ''}
        <div class="popup-row"><span>Weekly</span><strong>${fmt(l.weekly)}${deposit}</strong></div>
        <div class="popup-row"><span>Monthly</span><strong>${fmt(l.monthly)}${mDeposit}</strong></div>
        ${l.beds != null ? `<div class="popup-row"><span>Beds</span><strong>${l.beds}</strong></div>` : ''}
        ${l.eircode ? `<div class="popup-row"><span>Eircode</span><strong>${l.eircode}</strong></div>` : ''}
        ${l.url ? `<a class="popup-link" href="${l.url}" target="_blank" rel="noopener">View full listing for ${l.title} (opens in new tab) ↗</a>` : ''}
        <button type="button" class="contact-toggle${contacted ? ' is-contacted' : ''}">${contacted ? '✕ Contacted — mark as not contacted' : 'Mark as contacted'}</button>
      </div>`;
  }

  function markerIcon(l) {
    const abbr = TYPE_ABBR[l.type] || '?';
    const contactedClass = isContacted(l) ? ' contacted' : '';
    return L.divIcon({
      className: '',
      html: `<div class="marker-wrap${contactedClass}"><div class="marker-badge" style="background:${l.color}">${abbr}</div></div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
    });
  }

  function buildMarkers(listings) {
    clusterGroup.clearLayers();
    allMarkers = [];

    listings.forEach(l => {
      if (l.lat == null || l.lng == null) return;
      const marker = L.marker([l.lat, l.lng], {
        icon: markerIcon(l),
        title: markerTitle(l),
        alt: l.title + (isContacted(l) ? ' (contacted)' : ''),
      }).bindPopup(makePopup(l), { maxWidth: 340 });
      marker.on('popupopen', () => wireContactButton(marker, l));
      allMarkers.push({ marker, listing: l });
      clusterGroup.addLayer(marker);
    });
  }

  function applyFilters() {
    const showDigs = document.getElementById('chk-digs').checked;
    const showRoom = document.getElementById('chk-room').checked;
    const showBnb = document.getElementById('chk-bnb').checked;
    const showRoom7 = document.getElementById('chk-room7').checked;
    const maxWeekly = parseInt(document.getElementById('max-weekly').value, 10);
    const minBeds = parseInt(document.getElementById('min-beds').value, 10);

    clusterGroup.clearLayers();
    let visible = 0;

    allMarkers.forEach(({ marker, listing: l }) => {
      const typeOk = (l.type === 'Digs 5 Days' && showDigs) ||
                     (l.type === 'Room in Owner Occupied House' && showRoom) ||
                     (l.type === 'Digs/B&B 7 Days' && showBnb) ||
                     (l.type === 'Room in Owner Occupied House 7 Days' && showRoom7);
      const priceOk = l.weekly == null || l.weekly <= maxWeekly;
      const bedsOk  = l.beds == null || l.beds >= minBeds;

      if (typeOk && priceOk && bedsOk) {
        clusterGroup.addLayer(marker);
        visible++;
      }
    });

    const total = allListings.length;
    const noCoords = allListings.filter(l => l.lat == null).length;
    document.getElementById('count-label').textContent =
      `${visible} shown · ${total - noCoords} mapped · ${noCoords} without coords`;
  }

  function updateWeeklyLabel() {
    const el = document.getElementById('max-weekly');
    const v = el.value;
    const text = v >= 400 ? '€400+' : `€${v}`;
    document.getElementById('weekly-label').textContent = text;
    el.setAttribute('aria-valuetext', v >= 400 ? '€400 or more' : `€${v} maximum weekly rent`);
  }

  function updateBedsLabel() {
    const el = document.getElementById('min-beds');
    const v = el.value;
    document.getElementById('beds-label').textContent = `${v}+`;
    el.setAttribute('aria-valuetext', `${v} or more beds`);
  }

  function setRefreshingUI(refreshing) {
    document.getElementById('refreshing-badge').style.display = refreshing ? 'inline-block' : 'none';
    document.getElementById('refresh-btn').disabled = refreshing;
  }

  function renderListings(data) {
    allListings = data.listings || [];
    buildMarkers(allListings);
    applyFilters();

    const fetchedAt = new Date(data.fetchedAt);
    const ageMin = Math.round((Date.now() - fetchedAt.getTime()) / 60000);
    document.getElementById('last-updated').textContent =
      `Updated ${ageMin < 1 ? 'just now' : ageMin + 'm ago'}`;

    document.getElementById('stale-badge').style.display = data.stale ? 'inline-block' : 'none';
    setRefreshingUI(data.refreshing);
  }

  async function loadListings() {
    document.getElementById('loading').classList.remove('hidden');
    try {
      const res = await fetch('/api/listings');
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      renderListings(data);

      if (data.refreshing) {
        pollUntilDone();
      }
    } catch (err) {
      alert('Failed to load listings: ' + err.message);
    } finally {
      document.getElementById('loading').classList.add('hidden');
    }
  }

  async function pollUntilDone() {
    while (true) {
      await new Promise(r => setTimeout(r, 8000));
      const res = await fetch('/api/status');
      const status = await res.json();
      if (!status.refreshing) {
        const data = await (await fetch('/api/listings')).json();
        renderListings(data);
        break;
      }
    }
  }

  async function forceRefresh() {
    document.getElementById('refresh-btn').disabled = true;
    setRefreshingUI(true);
    await fetch('/api/refresh', { method: 'POST' });
    pollUntilDone();
  }

  loadListings();
</script>
</body>
</html>
